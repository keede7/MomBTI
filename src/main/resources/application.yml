spring:
  application:
    name: MomBTI
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 64KB

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
