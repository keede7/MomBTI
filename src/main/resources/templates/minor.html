<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>MomBTI · 안내</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <article class="sheet">
        <header class="sheet-head">
            <h1>19세 이상부터 계산할 수 있어요</h1>
        </header>
        <section class="section">
            <p>성장기에는 감량 목표보다 규칙적인 식사, 충분한 수면, 꾸준한 신체 활동이 더 중요해요.</p>
            <ul class="notices">
                <li>세 끼를 거르지 않고 채소·단백질 반찬을 골고루 먹어요</li>
                <li>하루 60분 정도 몸을 움직이는 시간을 만들어요</li>
                <li>잠을 충분히 자요</li>
            </ul>
            <p>체중이 고민된다면 보호자와 함께 소아청소년과 의사나 영양 전문가와 상의해 보세요.</p>
            <a class="btn btn-primary" th:href="@{/}">홈으로 가기</a>
        </section>
    </article>
