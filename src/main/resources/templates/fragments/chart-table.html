<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 차트와 같은 데이터. JS가 꺼져 있어도 모든 정보를 볼 수 있게 서버가 항상 렌더한다 (ADR-014) -->
<div th:fragment="table" class="table-scroll" tabindex="0" role="region" aria-labelledby="chart-table-caption">
    <table id="chart-table" class="data-table">
        <caption id="chart-table-caption">2주 간격 예상 체중 (kg). 12주 뒤 행은 6개월 보기 범위예요</caption>
        <thead>
        <tr>
            <th scope="col">시점</th>
            <th scope="col">날짜</th>
            <th scope="col" th:each="s : ${chart.series}" th:text="${s.label}">식단만</th>
            <th scope="col">개인차 범위 (식단만)</th>
            <th scope="col">현실 보정 (식단만) <span th:replace="~{fragments/evidence :: assumed}"></span></th>
            <th scope="col" th:if="${chart.showTarget}">목표</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="week, it : ${chart.weeks}"
            th:class="${week > chart.defaultWeeks} ? 'chart-row is-extended' : 'chart-row'">
            <th scope="row" th:text="${week == 0} ? '지금' : |${week}주 후|">2주 후</th>
            <td th:text="${chart.dates[it.index]}">2026년 11월 둘째 주</td>
            <td class="num" th:each="s : ${chart.series}" th:text="${s.weightsKg[it.index]}">67.5</td>
            <td class="num" th:text="|${chart.bandLowerKg[it.index]}~${chart.bandUpperKg[it.index]}|">67.0~68.0</td>
            <td class="num" th:text="${chart.series[0].adherenceWeightsKg[it.index]}">67.8</td>
            <td class="num" th:if="${chart.showTarget}" th:text="${chart.targetKg}">60.0</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
