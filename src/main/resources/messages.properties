# 입력 오류 (docs/PRD.md 엣지 케이스 E-코드와 매핑)
E-03.gender=성별을 선택해 주세요
E-03.age=나이를 입력해 주세요
E-03.heightCm=키를 입력해 주세요
E-03.weightKg=몸무게를 입력해 주세요
E-05=80세 이하만 계산할 수 있어요
E-07=m가 아닌 cm로 입력해 주세요 (예: 175)
E-08.age=나이를 숫자로 입력해 주세요 (예: 30)
E-08.heightCm=키는 120~230cm 사이로 입력해 주세요 (예: 175)
E-08.weightKg=몸무게는 30~300kg 사이로 입력해 주세요 (예: 72.5)
E-08.targetWeightKg=목표 체중은 30~300kg 사이로 입력해 주세요 (예: 65)
E-08.decimal=소수 첫째 자리까지 입력해 주세요 (예: 72.5)
E-09=키(cm)와 몸무게(kg) 단위를 확인해 주세요
E-13=건강 범위 최저 체중은 {0}kg이에요
E-23=체지방률은 남 5~60%, 여 12~60% 사이로 입력해 주세요
# E-10: 정규화해도 숫자가 아닌 값
typeMismatch=숫자로 입력해 주세요 (예: 72.5)
typeMismatch.age=나이를 숫자로 입력해 주세요 (예: 30)
typeMismatch.gender=성별을 선택해 주세요
typeMismatch.activityLevel=활동량을 목록에서 골라 주세요
typeMismatch.refineActivityLevel=활동량을 목록에서 골라 주세요

# 리포트 문구
report.bodyFatMismatch=입력한 체지방률이 키·몸무게로 추정한 값과 많이 달라요. 입력한 값으로 계산했어요.
